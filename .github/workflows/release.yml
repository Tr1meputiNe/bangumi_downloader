name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

  windows-release:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # windows-latest 上的 Node 来自 nodejs.org，带有 SEA 哨兵，可以正常注入
      - name: Build single-file exe
        run: npm run build

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 必须用绝对路径：后面会 Push-Location 到临时目录，相对路径会失效
          $exe = (Resolve-Path "release/windows/bangumi-downloader.exe").Path
          if (-not (Test-Path $exe)) { throw "找不到构建产物 $exe" }

          $version = (& $exe --version | Out-String)
          Write-Host "版本输出：$version"
          if ($LASTEXITCODE -ne 0) { throw "exe --version 退出码 $LASTEXITCODE" }
          if ($version -notmatch '\d+\.\d+\.\d+') { throw "exe --version 没有输出版本号：$version" }

          # 只断言 ASCII 片段：中文在 CI 控制台里受代码页影响，断言它容易假失败
          $help = (& $exe --help | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "exe --help 退出码 $LASTEXITCODE" }
          if ($help -notmatch '--dry-run' -or $help -notmatch '--config') {
            throw "exe --help 输出不完整：`n$help"
          }
          Write-Host "help 输出正常"

          # 在没有 config.json 的干净目录里应当自动生成一份
          $tmp = Join-Path $env:RUNNER_TEMP "bdl-smoke"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Push-Location $tmp
          try {
            & $exe config | Out-Null
            if (-not (Test-Path "config.json")) { throw "exe config 没有生成 config.json" }
            Write-Host "配置文件已生成"
          } finally {
            Pop-Location
          }

          Write-Host "冒烟测试通过"

      - name: Create release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-${{ github.run_number }}" }
          $zip = "bangumi-downloader-$tag-windows-x64.zip"

          # 包内所有文件名都是纯 ASCII（脚本一律用 1-setup.cmd 这类名字，
          # 中文说明放在文件内容里）。这一点是刻意的：Compress-Archive 和
          # Windows 自带的 bsdtar 都会按系统 OEM 代码页写文件名，
          # 中文名在 zip 里会变成乱码且无法还原。用 ASCII 名后两者都安全。
          Compress-Archive -Path "release/windows/*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "没有生成 $zip" }

          # 校验包里确实没有非 ASCII 文件名，避免以后改名时不知不觉踩回坑里
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            $bad = $archive.Entries | Where-Object { $_.FullName -match '[^\x20-\x7E]' }
            if ($bad) {
              throw "zip 里存在非 ASCII 文件名，会在解压时乱码：$($bad.FullName -join ', ')"
            }
            Write-Host "包内文件名检查通过（$($archive.Entries.Count) 个条目全为 ASCII）"
          } finally {
            $archive.Dispose()
          }

          Get-FileHash $zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content "SHA256SUMS.txt"
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            ${{ env.ZIP_NAME }}
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view "$env:TAG_NAME" 2>$null) {
            gh release upload "$env:TAG_NAME" $env:ZIP_NAME SHA256SUMS.txt --clobber
          } else {
            gh release create "$env:TAG_NAME" $env:ZIP_NAME SHA256SUMS.txt --title "bangumi-downloader $env:TAG_NAME" --generate-notes
          }
